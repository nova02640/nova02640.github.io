# ============================================================
# nova02640.github.io — 配置（hugo-theme-lumen）
# 迁移自 hugo-bearblog：保留原站 URL 结构与菜单，原站没有的
# 功能（友链/社交图标/搜索/评论/公告/PWA/分类标签聚合页等）一律不开启。
# ============================================================

baseURL = "https://nova02640.github.io"
theme = "hugo-theme-lumen"
title = "nova02640's Blog"
author = "nova02640"
copyright = "© 2026 nova02640"
locale = "zh-cn"
hasCJKLanguage = true
enableRobotsTXT = true
# 原站禁用分类/标签聚合页，迁移后保持一致
disableKinds = ["taxonomy"]
ignoreErrors = ["error-disable-taxonomy"]
# 11 篇文章一页放完（原站 /blog/ 无分页）
paginate = 20

[permalinks]
  blog = "/:slug/"

# 主导航：仅 Blog + About（首页由左上角站点名链接直达）
[[menu.main]]
  identifier = "blog"
  name = "Blog"
  url = "/blog/"
  weight = 10

[[menu.main]]
  identifier = "about"
  name = "About"
  url = "/about/"
  weight = 20

[params]
  description = "Personal blog · Thoughts and sharing"
  title = "nova02640's Blog"
  copyright = "© 2026 nova02640"
  # --- 原站没有的功能，一律不配置 ---
  # 社交账号：不配 [params.social]         → 页脚不渲染社交图标
  # 公告：不配 [params.announcement]       → 不渲染公告栏
  # 评论：enableComments 默认 false       → 不渲染评论区
  # 搜索：enableSearch 默认 false         → 头部无搜索入口、不生成搜索页
  # PWA：enablePWA 默认 false            → 不生成 manifest / sw
  # 头像：不配 [params.author].avatar     → 无头像
  # 版权许可块：不配 [params.license]     → 文章页无许可声明

  [params.author]
    name = "nova02640"   # 仅用于 JSON-LD 作者元数据（无 avatar）

[markup]
  [markup.goldmark.renderer]
    unsafe = true        # 允许正文内嵌原始 HTML
  [markup.highlight]
    noClasses = false    # class 模式，由 Lumen CSS 适配明暗双主题
    lineNos = true
    lineNumbersInTable = false
    codeFences = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false
