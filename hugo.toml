baseURL = "https://nova02640.github.io"
title = "nova02640's Blog"
theme = "paper"
paginate = 10
defaultContentLanguage = "zh-cn"
enableRobotsTXT = true
author = "nova02640"
copyright = "© 2026 nova02640"

[params]
  description = "个人博客 · 记录思考与分享"
  dateFormat = "2006-01-02"
  mainSections = ["posts"]
  name = "nova02640"
  bio = "程序员 · 记录思考与分享 · 用代码丈量世界"
  # 强调色（Paper 支持 linen/wheat/gray/light）
  color = "linen"

[[params.social]]
  name = "github"
  url = "https://github.com/nova02640"

[[menu.main]]
  identifier = "about"
  name = "关于"
  url = "/about/"
  weight = 10

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.highlight]
      codeFences = true
      guessSyntax = true
      lineNos = false

[outputs]
  home = ["HTML", "RSS", "JSON"]
